<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Distant Stars -->
  <circle cx="100" cy="120" r="6" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="420" cy="90" r="5" fill="#FDE047" opacity="0.9"/>
  <circle cx="380" cy="400" r="7" fill="#67E8F9" opacity="0.7"/>
  <circle cx="80" cy="380" r="5" fill="#F472B6" opacity="0.8"/>
  <circle cx="260" cy="70" r="4" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Rocket Exhaust Flames -->
  <path d="M 230 360 Q 256 460 256 470 Q 256 460 282 360 Z" fill="#F97316"/>
  <path d="M 240 360 Q 256 430 256 440 Q 256 430 272 360 Z" fill="#FDE047"/>
  
  <!-- Rocket Wings / Fins -->
  <path d="M 170 300 L 120 370 L 210 350 Z" fill="url(#gold)"/>
  <path d="M 342 300 L 392 370 L 302 350 Z" fill="url(#gold)"/>
  
  <!-- Rocket Fuselage Body -->
  <path d="M 256 80 C 330 160 330 300 300 360 L 212 360 C 182 300 182 160 256 80 Z" fill="url(#rocket)"/>
  
  <!-- Cockpit Window -->
  <circle cx="256" cy="210" r="42" fill="url(#window)" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="270" cy="195" r="14" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Golden Star -->
  <polygon points="256,125 264,145 285,145 268,157 274,178 256,165 238,178 244,157 227,145 248,145" fill="url(#gold)"/>
</svg>
