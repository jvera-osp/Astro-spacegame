name: ⚡ Compilación Rápida APK y AAB (Sin Configurar Nada)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Compilar APK y AAB descargables
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔎 Verificar versión de Node
        run: node -v && npm -v

      - name: 📦 Instalar dependencias npm
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Compilar aplicación web (Vite)
        run: |
          npm run build

      - name: 🔄 Sincronizar con Capacitor Android
        run: |
          npx cap sync android

      - name: 🛠️ Verificar y Restaurar Gradle Wrapper si falta
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle Wrapper no encontrado en android/. Restaurando desde template..."
            tar -zxvf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradlew.bat gradle/
          fi
          chmod +x android/gradlew

      - name: 🔑 Generar Keystore temporal de prueba
        run: |
          mkdir -p android/keystores
          keytool -genkey -v -keystore android/keystores/debug-release.keystore \
            -alias astrodebug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AstroEsquivaDebug!" -keypass "AstroEsquivaDebug!" \
            -dname "CN=Astro Esquiva Tester, OU=Dev, O=AstroEsquiva, C=ES"

      - name: 📱 Compilar APK (.APK)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: AstroEsquivaDebug!
          ANDROID_KEY_ALIAS: astrodebug
          ANDROID_KEY_PASSWORD: AstroEsquivaDebug!
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📦 Compilar AAB (.AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: AstroEsquivaDebug!
          ANDROID_KEY_ALIAS: astrodebug
          ANDROID_KEY_PASSWORD: AstroEsquivaDebug!
        run: |
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: ✍️ Preparar y Verificar Archivos Finales
        run: |
          mkdir -p android/app/build/outputs/dist

          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_RAW" ]; then
            echo "APK generado: $APK_RAW"
            if echo "$APK_RAW" | grep -q "unsigned"; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore android/keystores/debug-release.keystore \
                -storepass "AstroEsquivaDebug!" \
                -keypass "AstroEsquivaDebug!" \
                "$APK_RAW" astrodebug
            fi
            cp "$APK_RAW" android/app/build/outputs/dist/astro-esquiva-instalable.apk
          else
            echo "ERROR: No se encontró archivo APK en build/outputs/apk/release"
            exit 1
          fi

          AAB_RAW=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_RAW" ]; then
            echo "AAB generado: $AAB_RAW"
            if echo "$AAB_RAW" | grep -q "unsigned"; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore android/keystores/debug-release.keystore \
                -storepass "AstroEsquivaDebug!" \
                -keypass "AstroEsquivaDebug!" \
                "$AAB_RAW" astrodebug
            fi
            cp "$AAB_RAW" android/app/build/outputs/dist/astro-esquiva-googleplay.aab
          else
            echo "ERROR: No se encontró archivo AAB en build/outputs/bundle/release"
            exit 1
          fi

      - name: 🚀 Subir APK a Descargas de GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: astro-esquiva-celular-APK
          path: android/app/build/outputs/dist/astro-esquiva-instalable.apk
          retention-days: 30

      - name: 🚀 Subir AAB a Descargas de GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: astro-esquiva-googleplay-AAB
          path: android/app/build/outputs/dist/astro-esquiva-googleplay.aab
          retention-days: 30
