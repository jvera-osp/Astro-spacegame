name: ⚡ Compilación Rápida APK y AAB (Sin Configurar Nada)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Compilar APK y AAB descargables
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: |
          npm ci || npm install

      - name: 🔨 Compilar aplicación web (Vite)
        run: |
          npm run build

      - name: 🔄 Sincronizar con Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Generar Keystore para pruebas
        run: |
          mkdir -p android/keystores
          keytool -genkey -v -keystore android/keystores/debug-release.keystore \
            -alias astrodebug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AstroEsquivaDebug!" -keypass "AstroEsquivaDebug!" \
            -dname "CN=Astro Esquiva Tester, OU=Dev, O=AstroEsquiva, C=ES"

      - name: 🛡️ Dar permisos de ejecución a Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 📱 Compilar APK (.APK)
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: 📦 Compilar AAB (.AAB)
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: ✍️ Firmar APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/keystores/debug-release.keystore \
            -storepass "AstroEsquivaDebug!" \
            -keypass "AstroEsquivaDebug!" \
            "$APK_FILE" astrodebug
          cp "$APK_FILE" android/app/build/outputs/apk/release/astro-esquiva-instalable.apk

      - name: ✍️ Firmar AAB
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/keystores/debug-release.keystore \
            -storepass "AstroEsquivaDebug!" \
            -keypass "AstroEsquivaDebug!" \
            "$AAB_FILE" astrodebug
          cp "$AAB_FILE" android/app/build/outputs/bundle/release/astro-esquiva-googleplay.aab

      - name: 🚀 Subir APK a Descargas de GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: astro-esquiva-celular-APK
          path: android/app/build/outputs/apk/release/astro-esquiva-instalable.apk
          retention-days: 30

      - name: 🚀 Subir AAB a Descargas de GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: astro-esquiva-googleplay-AAB
          path: android/app/build/outputs/bundle/release/astro-esquiva-googleplay.aab
          retention-days: 30
