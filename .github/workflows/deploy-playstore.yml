name: 🚀 Release Android a Google Play

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "internal para pruebas internas, alpha para prueba cerrada, beta para prueba abierta"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: play-store-release
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Compilar, firmar y publicar
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🧰 Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$RUNNER_TEMP"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d cmdline-tools-unpacked
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools-unpacked/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdkmanager_status" -ne 0 ]; then
            echo "::error::No se pudieron aceptar las licencias del Android SDK."
            exit "$sdkmanager_status"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: 🔨 Compilar aplicación web
        run: npm run build

      - name: 🔄 Sincronizar Capacitor
        run: npx cap sync android

      - name: 🔧 Habilitar Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔐 Validar y preparar clave de carga
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configura los cuatro secrets ANDROID_KEYSTORE_* requeridos antes de ejecutar el release."
            exit 1
          fi
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::Falta el secret PLAY_STORE_JSON_KEY. Es necesario para publicar automáticamente en Google Play."
            exit 1
          fi

          mkdir -p android/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystores/release.keystore
          chmod 600 android/keystores/release.keystore
          if ! keytool -list -keystore android/keystores/release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::El keystore, la contraseña o el alias no son válidos."
            exit 1
          fi

      - name: 🧱 Compilar y firmar APK/AAB de release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          version_name="1.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              version_name="${BASH_REMATCH[1]}"
            else
              echo "::error::Usa etiquetas de release con formato vMAJOR.MINOR.PATCH, por ejemplo v1.0.1."
              exit 1
            fi
          fi
          ./gradlew assembleRelease bundleRelease \
            -PreleaseVersionCode="$version_code" \
            -PreleaseVersionName="$version_name" \
            --stacktrace --no-daemon

      - name: ✅ Verificar y preparar artefactos firmados
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$apk" || { echo "::error::No se generó el APK firmado."; exit 1; }
          test -f "$aab" || { echo "::error::No se generó el AAB firmado."; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          jarsigner -verify "$aab"
          mkdir -p android/app/build/outputs/dist
          cp "$apk" android/app/build/outputs/dist/astro-esquiva-release.apk
          cp "$aab" android/app/build/outputs/dist/astro-esquiva-release.aab

      - name: 📤 Guardar artefactos firmados
        uses: actions/upload-artifact@v4
        with:
          name: astro-esquiva-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/dist/astro-esquiva-release.apk
            android/app/build/outputs/dist/astro-esquiva-release.aab
          retention-days: 90

      - name: 🚀 Publicar en Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.astroesquiva.spacegame
          releaseFiles: android/app/build/outputs/dist/astro-esquiva-release.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed
